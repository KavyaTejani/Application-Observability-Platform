# Local development stack: private backends for the API and web app, which run on the host
# via `npm run dev:api` / `npm run dev:web`.
#
# Every backend sits on the internal `backend` network. Ports are published ONLY on 127.0.0.1
# so the host-run API can reach them during development; nothing is reachable from other
# machines. The production file (compose.prod.yaml) publishes no backend ports.
name: aop

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ['--bind_ip_all', '--quiet']
    volumes:
      - mongo-data:/data/db
    ports:
      - '127.0.0.1:27017:27017'
    networks: [backend]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--norc', '--eval', 'db.adminCommand("ping").ok']
      # mongosh is a Node.js program and can take several seconds to start on small machines
      # (such as 2-core CI runners), so the check gets a generous timeout and a start-up grace
      # period during which failures do not count.
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 60s
      start_interval: 2s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Explicit memory ceiling and eviction policy (PRD §16). Redis holds counters and short-lived
    # coordination only; durable state lives in MongoDB. AOF keeps counters across restarts.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retention is a single global setting in Prometheus (PRD RET-002): 15 days.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    # Lets Prometheus scrape the API's internal listener while the API runs on the host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 5

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - '127.0.0.1:3100:3100'
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/ready']
      interval: 10s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '127.0.0.1:4318:4318'
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  prometheus-data:
  loki-data:
